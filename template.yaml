AWSTemplateFormatVersion: 2010-09-09
Transform: AWS::Serverless-2016-10-31
Description: SAM Template for vpcx_core_infra lambda as ALB target

Parameters:
  Subnets:
    Type: List<AWS::EC2::Subnet::Id>
    Default: "subnet-0cd12c33f4ca435c0, subnet-0c2c28fb6064cde11"
  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: "vpc-02c5c9737aa7b41df"
  StaticCFTemplateBucketName:
    Type: String
    Default: "dev-account-provisioning-static-cf-templates-us-west-2"
  AccountProvisioningMetadataBucketName:
    Type: String
    Default: "dev-account-provisioning-vpc-metadata-us-west-2"

Resources:
  VpcIntegALBLambdaRole1:
    Type: AWS::IAM::Role
    Properties:
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: allow-kms-write
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              Effect: 'Allow'
              Action:
                - 'kms:Decrypt'
                - 'kms:DescribeKey'
                - 'kms:ListKeys'
              Resource:
                - '*'
        - PolicyName: allow-org
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: 'Allow'
                Action:
                  - 'organizations:*'
                Resource:
                  - '*'
        - PolicyName: allow-dynamodb-write
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Action: dynamodb:*
                Resource: "*"
                Effect: Allow
        - PolicyName: allow-ssm-read-write
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Action: ssm:*
                Resource: "*"
                Effect: Allow
        - PolicyName: allow-sts
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: 'Allow'
                Action:
                  - 'sts:AssumeRole'
                Resource:
                  - 'arn:aws:iam::*:role/*'

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow http to client host
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  VpcIntegration:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Architectures:
        - x86_64
      Role: !GetAtt VpcIntegALBLambdaRole1.Arn
      Timeout: 600
      MemorySize: 2048
      Environment:
        Variables:
          ENVIRONMENT: dev
          STATIC_CF_TEMPLATE_BUCKET: !Ref StaticCFTemplateBucket
          METADATA_TEMPLATE_BUCKET: !Ref AccountProvisioningMetadataBucket
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: ./vpcx_core_infra
      DockerTag: python3.8-v1

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Subnets: !Ref Subnets
      SecurityGroups:
        - !Ref LoadBalancerSecurityGroup

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    DependsOn: VpcIntegrationInvokePermission
    Properties:
      TargetType: lambda
      Targets:
        - Id: !GetAtt VpcIntegration.Arn

  HttpListener:
    Type: 'AWS::ElasticLoadBalancingV2::Listener'
    Properties:
      DefaultActions:
        - TargetGroupArn: !Ref TargetGroup
          Type: forward
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP

  VpcIntegrationInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt VpcIntegration.Arn
      Action: 'lambda:InvokeFunction'
      Principal: elasticloadbalancing.amazonaws.com

  StaticCFTemplateBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref StaticCFTemplateBucketName
      AccessControl: BucketOwnerFullControl
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  AccountProvisioningMetadataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref AccountProvisioningMetadataBucketName
      AccessControl: BucketOwnerFullControl
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

Outputs:
  LoadBalancerDNSNAme:
    Value: !GetAtt LoadBalancer.DNSName
